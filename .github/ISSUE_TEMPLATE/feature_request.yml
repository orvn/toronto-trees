name: 💡 Request a feature
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: What you'd like to see added or changed
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything to add?
      description: Examples, sketches, links, if you have them
    validations:
      required: false
